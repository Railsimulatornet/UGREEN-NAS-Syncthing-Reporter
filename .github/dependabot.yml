version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-patch:
        update-types: [patch]
      actions-minor:
        update-types: [minor]

  - package-ecosystem: docker
    directory: "/syncthing/syncthing_reporter_py"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker-patch:
        update-types: [patch]
      docker-minor:
        update-types: [minor]

  - package-ecosystem: pip
    directory: "/syncthing/syncthing_reporter_py"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-patch:
        update-types: [patch]
      python-minor:
        update-types: [minor]
